<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Map — Real-Time Global Intelligence Dashboard</title>
  <meta name="description" content="An interactive world map showing real-time global online attention from Reddit and Wikipedia. See where the world is focused right now." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="app-header" role="banner">
    <div class="header-left">
      <div class="logo" id="logo">
        <i class="fa-solid fa-earth-americas"></i>
        <span class="logo-text">Knowledge Map</span>
        <span class="logo-badge">LIVE</span>
      </div>
    </div>
    <div class="header-center">
      <div class="stats-bar" id="stats-bar" aria-live="polite">
        <div class="stat-item" id="stat-topics">
          <i class="fa-solid fa-hashtag"></i>
          <span class="stat-value" id="stat-topics-value">0</span>
          <span class="stat-label">Topics</span>
        </div>
        <div class="stat-item" id="stat-regions">
          <i class="fa-solid fa-globe"></i>
          <span class="stat-value" id="stat-regions-value">0</span>
          <span class="stat-label">Regions</span>
        </div>
        <div class="stat-item" id="stat-sync">
          <i class="fa-solid fa-clock"></i>
          <span class="stat-value" id="stat-sync-value">—</span>
          <span class="stat-label">Last Sync</span>
        </div>
        <div class="stat-item freshness-indicator" id="stat-freshness">
          <span class="freshness-dot" id="freshness-dot"></span>
          <span class="stat-label" id="freshness-label">Waiting</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="search-container" id="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" placeholder="Search countries… ( / )" autocomplete="off" aria-label="Search countries" />
        <ul id="search-dropdown" class="search-dropdown" role="listbox" aria-label="Search results"></ul>
      </div>
      <button class="header-btn" id="btn-sync" title="Sync data (R)" aria-label="Refresh data">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      
      <button class="header-btn mobile-filter-toggle" id="btn-filter-mobile" title="Toggle filters (F)" aria-label="Toggle category filters">
        <i class="fa-solid fa-filter"></i>
      </button>
    </div>
  </header>
  <nav id="filter-bar" class="filter-bar" role="navigation" aria-label="Category filters">
    <button class="filter-chip active" data-category="all">
      <i class="fa-solid fa-layer-group"></i> All
    </button>
    <button class="filter-chip" data-category="conflict">
      <i class="fa-solid fa-shield-halved"></i> Conflict &amp; Politics
    </button>
    <button class="filter-chip" data-category="science">
      <i class="fa-solid fa-flask"></i> Science &amp; Tech
    </button>
    <button class="filter-chip" data-category="economy">
      <i class="fa-solid fa-chart-line"></i> Economy
    </button>
    <button class="filter-chip" data-category="culture">
      <i class="fa-solid fa-palette"></i> Culture &amp; Sports
    </button>
  </nav>
  <main id="map-container">
    <div id="map" role="application" aria-label="Interactive world map"></div>
  </main>
  <aside id="detail-panel" class="detail-panel" role="complementary" aria-label="Country details" aria-hidden="true" inert>
    <div class="panel-drag-handle" id="panel-drag-handle" aria-hidden="true">
      <span class="drag-bar"></span>
    </div>
    <div class="panel-header">
      <div class="panel-title-row">
        <h2 id="panel-country-name" class="panel-country-name">—</h2>
        <div class="panel-actions">
          <button class="panel-btn" id="btn-share" title="Share" aria-label="Share country summary">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
          <button class="panel-btn" id="btn-close-panel" title="Close (Esc)" aria-label="Close panel">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div class="panel-tabs" role="tablist" aria-label="Detail tabs">
        <button class="panel-tab active" role="tab" data-tab="overview" aria-selected="true" id="tab-overview">Overview</button>
        <button class="panel-tab" role="tab" data-tab="topics" aria-selected="false" id="tab-topics">Topics</button>
        <button class="panel-tab" role="tab" data-tab="sources" aria-selected="false" id="tab-sources">Sources</button>
        <button class="panel-tab" role="tab" data-tab="neighbours" aria-selected="false" id="tab-neighbours">Neighbours</button>
      </div>
    </div>
    <div class="panel-body" id="panel-body">
      <section class="tab-content active" id="content-overview" role="tabpanel" aria-labelledby="tab-overview">
        <div class="overview-score-block">
          <div class="score-label">Activity Score</div>
          <div class="score-big" id="overview-score">0</div>
          <div class="score-bar-track">
            <div class="score-bar-fill" id="overview-bar"></div>
          </div>
        </div>
        <div class="overview-delta" id="overview-delta">
          <span class="delta-icon"></span>
          <span class="delta-text">No previous data</span>
        </div>
        <div class="overview-meta">
          <span id="overview-updated"><i class="fa-regular fa-clock"></i> —</span>
        </div>
      </section>
      <section class="tab-content" id="content-topics" role="tabpanel" aria-labelledby="tab-topics">
        <div class="topics-chart" id="topics-chart">
          <div class="skeleton-block"></div>
          <div class="skeleton-block short"></div>
          <div class="skeleton-block shorter"></div>
        </div>
      </section>
      <section class="tab-content" id="content-sources" role="tabpanel" aria-labelledby="tab-sources">
        <ul class="sources-list" id="sources-list">
          <li class="skeleton-block"></li>
          <li class="skeleton-block"></li>
          <li class="skeleton-block"></li>
        </ul>
      </section>
      <section class="tab-content" id="content-neighbours" role="tabpanel" aria-labelledby="tab-neighbours">
        <ul class="neighbours-list" id="neighbours-list">
          <li class="skeleton-block"></li>
          <li class="skeleton-block"></li>
          <li class="skeleton-block"></li>
        </ul>
      </section>
    </div>
  </aside>
  <div id="trending-ticker" class="trending-ticker" aria-label="Trending topics">
    <div class="ticker-label">
      <i class="fa-solid fa-fire-flame-curved"></i> Trending
    </div>
    <div class="ticker-track" id="ticker-track">
      <div class="ticker-content" id="ticker-content"></div>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite" aria-relevant="additions"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
