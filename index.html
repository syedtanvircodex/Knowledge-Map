<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Knowledge Map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">

        <div id="map"></div>

        <!-- Header -->
        <header id="header-overlay">
            <div class="header-brand">
                <div class="brand-icon">
                    <i class="fas fa-globe-americas"></i>
                </div>
                <h1>Global Knowledge Map</h1>
            </div>
            <div class="header-divider"></div>
            <div id="stats-bar">
                <div class="stat-item">
                    <span class="pulse-dot"></span>
                    <span id="last-updated">Connecting…</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Topics</span>
                    <b id="active-topics" class="stat-value">—</b>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Countries</span>
                    <b id="active-countries" class="stat-value">—</b>
                </div>
            </div>
        </header>

        <!-- Loading -->
        <div id="loading-indicator" class="hidden">
            <i class="fas fa-circle-notch fa-spin"></i>
            <span>Fetching live data</span>
        </div>

        <!-- Legend -->
        <div id="map-legend">
            <div class="legend-title">Activity Density</div>
            <div class="legend-row">
                <div class="legend-swatch" style="background: var(--critical);"></div>
                <span>Critical</span>
            </div>
            <div class="legend-row">
                <div class="legend-swatch" style="background: var(--high);"></div>
                <span>High</span>
            </div>
            <div class="legend-row">
                <div class="legend-swatch" style="background: var(--moderate);"></div>
                <span>Moderate</span>
            </div>
            <div class="legend-row">
                <div class="legend-swatch" style="background: var(--low);"></div>
                <span>Low</span>
            </div>
            <div class="legend-row">
                <div class="legend-swatch" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-dim)"></div>
                <span>No data</span>
            </div>
        </div>

        <!-- Side Panel -->
        <aside id="side-panel" class="hidden">
            <div class="panel-header">
                <div class="panel-header-info">
                    <span class="panel-label">Country Analysis</span>
                    <h2 id="panel-country-name">—</h2>
                </div>
                <button id="close-panel-btn" aria-label="Close panel"><i class="fas fa-xmark"></i></button>
            </div>

            <div class="panel-content">
                <!-- Score -->
                <div class="metric-card">
                    <div class="metric-header">
                        <h3>Activity Score</h3>
                        <span id="popularity-score-value">0</span>
                    </div>
                    <div class="score-bar-container">
                        <div id="popularity-score-bar" class="score-bar" style="width:0%"></div>
                    </div>
                    <div class="score-sublabel">Aggregated mentions from global sources</div>
                </div>

                <!-- Topics -->
                <div class="topics-section">
                    <div class="section-header">
                        <h3><i class="fas fa-chart-bar"></i> Trending Topics</h3>
                        <span class="badge" id="topics-count">0</span>
                    </div>
                    <ul id="top-topics-list" class="data-list"></ul>
                </div>

                <!-- Articles -->
                <div class="related-section">
                    <div class="section-header">
                        <h3><i class="fas fa-newspaper"></i> Latest Sources</h3>
                        <span class="badge" id="articles-count">0</span>
                    </div>
                    <ul id="related-articles-list" class="data-list"></ul>
                </div>
            </div>
        </aside>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
